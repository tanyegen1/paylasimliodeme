# GitHub Codespaces için: uygulama kapsayıcısı + PostgreSQL. Yalnızca DEMO amaçlıdır.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://payimiz:payimiz@db:5432/payimiz_demo
    depends_on:
      - db
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: payimiz
      POSTGRES_PASSWORD: payimiz
      POSTGRES_DB: payimiz_demo
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
