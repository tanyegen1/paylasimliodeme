# Render.com "Deploy to Render" planı: tek tıkla web sunucusu + PostgreSQL.
# Yalnızca DEMO içindir: örnek kişiler, sandbox ödeme (gerçek para yok), örnek fiş okuma.
services:
  - type: web
    name: payimiz
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # Migration'ları uygular, demo verisini (yoksa) yükler, uygulamayı başlatır. PORT'u Render verir.
    startCommand: npm run db:seed:demo && npx next start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: payimiz-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: PAYMENT_PROVIDER
        value: sandbox
      - key: OCR_PROVIDER
        value: demo
      - key: NLP_PROVIDER
        value: rules
      - key: ANALYTICS_PROVIDER
        value: db
      - key: STORAGE_DIR
        value: ./storage/demo

databases:
  - name: payimiz-db
    plan: free
    databaseName: payimiz_demo
    user: payimiz
